  <script>
    try {
      const theme = localStorage.getItem('ligandx-theme');
      if (theme === 'light' || theme === 'dark') document.documentElement.setAttribute('data-theme', theme);
    } catch (e) {}
  </script>
  <style>
    html, body, #root { min-height: 100%; }
    html, body { margin: 0; background: #f9f9f8; }
    html[data-theme="dark"], html[data-theme="dark"] body { background: #070c0b; }
    #root { min-height: 100vh; }
    .js .seo-static { visibility: hidden; }
    .app-loading body::before {
      content: "Ligand-X";
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: grid;
      place-items: center;
      background: #f9f9f8;
      color: #1d6d60;
      font: 600 20px/1.2 "IBM Plex Sans", system-ui, sans-serif;
      letter-spacing: -0.02em;
    }
    html[data-theme="dark"].app-loading body::before {
      background: #070c0b;
      color: #75c8b9;
    }
    @media (prefers-reduced-motion: no-preference) {
      .app-loading body::before { animation: ligandx-loading-pulse 1.4s ease-in-out infinite; }
      @keyframes ligandx-loading-pulse { 50% { opacity: 0.55; } }
    }
  </style>

  <link rel="stylesheet" href="/ligand-x-assets/styles.css?v=20260728j" />
